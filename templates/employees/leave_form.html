{% extends 'base.html' %}

{% block title %}Request Leave - EMS{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h4>Request Leave</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Leave Type</label>
                        {{ form.leave_type }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Start Date</label>
                        {{ form.start_date }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">End Date</label>
                        {{ form.end_date }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Reason</label>
                        {{ form.reason }}
                    </div>
                    
                    <div class="text-end">
                        <a href="{% url 'employees:leave_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    input[type="date"], select, textarea {
        width: 100%;
        padding: 0.375rem 0.75rem;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
    }
</style>
{% endblock %}
